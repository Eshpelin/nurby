# Bundled Mosquitto broker for the Nurby MQTT integration.
# Mounted read-only by the profiled "mosquitto" service in
# docker-compose.yml (docs/integrations/mqtt.md).

listener 1883 0.0.0.0

# Anonymous access is enabled so the bundled broker works with zero
# setup on a trusted LAN (same model as the other Nurby services, which
# trust the local network). To lock it down:
#   1. allow_anonymous false
#   2. docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd nurby
#   3. password_file /mosquitto/data/passwd
#   4. set mqtt_username / mqtt_password in Nurby Settings -> MQTT
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
